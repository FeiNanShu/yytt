name: login-fix2
on:
  push:
    paths:
      - .github/workflows/login-fix2.yml
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: python3 patch_login2.py
      - name: commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "登录判定只看 cookie 变化"
          git push || true
