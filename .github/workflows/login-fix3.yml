name: login-fix3
on:
  push:
    paths:
      - patch_login3.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: python3 patch_login3.py || true
      - name: commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "登录窗口锁在应用内：拦掉外部跳转"
          git push origin HEAD:main || true
