name: text
on:
  push:
    paths:
      - patch_text.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_text.py || true
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git diff --cached --quiet || git commit -m "chore: 登录文案调整"
          git push origin HEAD:main || true
