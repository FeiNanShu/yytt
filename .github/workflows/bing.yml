name: bing
on:
  push:
    paths:
      - patch_bing.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_bing.py || true
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git diff --cached --quiet || git commit -m "feat: 地址栏非链接直接必应搜索"
          git push origin HEAD:main || true
