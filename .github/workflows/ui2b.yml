name: ui2b
on:
  push:
    paths:
      - .github/workflows/ui2b.yml
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: python3 patch_ui2.py
      - name: commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "工具箱精简为登录与论坛；标签页关闭后保留"
          git push || true
