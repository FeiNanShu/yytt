name: build-desktop
on:
  push:
    paths:
      - 'desktop-java/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  MAVEN_OPTS: '-Dfile.encoding=UTF-8'
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: commit log helper
        run: echo ok
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: fetch font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-java/src/main/resources/fonts | Out-Null
          curl.exe -sL -o desktop-java/src/main/resources/fonts/NotoSansCJKsc-Regular.otf "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
      - name: build jar
        shell: pwsh
        run: |
          mvn -B -f desktop-java/pom.xml package -DskipTests 2>&1 | Tee-Object -FilePath mvn.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: dump error
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path mvn.log) { Get-Content mvn.log | Select-Object -Last 60 | Out-File -Encoding utf8 build_error.txt }
          else { "no mvn.log" | Out-File -Encoding utf8 build_error.txt }
          git config user.name bot
          git config user.email bot@local
          git add build_error.txt
          git commit -m "log: mvn error"
          git push origin HEAD:main
      - name: jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jpackage --input desktop-java/target --main-jar duiyu-browser.jar --main-class com.feinanshu.Launcher --type app-image --name DuiyuBrowser --dest dist
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path dist/DuiyuBrowser/* -DestinationPath duiyu-browser-win.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duiyu-browser-win
          path: duiyu-browser-win.zip
      - name: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-last
          name: 堆域浏览器 桌面版
          body: JavaFX 桌面版，解压后双击 DuiyuBrowser.exe
          files: duiyu-browser-win.zip
