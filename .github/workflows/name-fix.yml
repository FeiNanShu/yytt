name: name-fix
on:
  push:
    paths:
      - patch_name.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: python3 patch_name.py || true
      - name: commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "改名堆域浏览器；默认主页；修正标题抓取"
          git push origin HEAD:main || true
