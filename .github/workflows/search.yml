name: search
on:
  push:
    paths:
      - patch_search.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_search.py || true
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git diff --cached --quiet || git commit -m "feat: 地址栏关键词搜索与 Wikidot 优先结果页"
          git push origin HEAD:main || true
