name: ui
on:
  push:
    paths:
      - patch_ui.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_ui.py || true
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git diff --cached --quiet || git commit -m "fix(desktop): 不再指定 Microsoft YaHei 字体"
          git push origin HEAD:main || true
