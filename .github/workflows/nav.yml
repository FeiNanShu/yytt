name: nav
on:
  push:
    paths:
      - patch_nav.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_nav.py || true
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git diff --cached --quiet || git commit -m "feat: 底部栏后退与前进"
          git push origin HEAD:main || true
