name: layout
on:
  push:
    paths:
      - patch_layout.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run patch
        run: python3 patch_layout.py || true
      - name: commit
        if: always()
        run: |
          git config user.name yytt-bot
          git config user.email bot@yytt.local
          git add -A
          git diff --cached --quiet || git commit -m "layout: buttons reordered"
          git push origin HEAD:main || true
