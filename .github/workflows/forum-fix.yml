name: forum-fix
on:
  push:
    paths:
      - patch_forum.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: python3 patch_forum.py || true
      - name: commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "论坛按钮改为直达账号的帖子与回复页"
          git push origin HEAD:main || true
