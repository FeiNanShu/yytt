name: font
on:
  push:
    paths:
      - patch_font.py
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_font.py || true
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git diff --cached --quiet || git commit -m "feat(desktop): 内置 Noto Sans CJK SC 字体，不依赖系统字体"
          git push origin HEAD:main || true
